<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe8" />
    <meta
      name="description"
      content="Practice Visit helps children preview a place before they go there."
    />
    <title>Practice Visit</title>
    <script>
      try {
        var scheme = localStorage.getItem("practice-visit-scheme");
        if (scheme === "cool" || scheme === "green" || scheme === "dark" || scheme === "warm") {
          document.documentElement.dataset.scheme = scheme;
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
